name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show environment
        shell: bash
        run: |
          uname -a
          python --version
          command -v sha256sum >/dev/null 2>&1 && echo "sha256sum: yes" || echo "sha256sum: no"
          command -v shasum     >/dev/null 2>&1 && echo "shasum: yes"     || echo "shasum: no"
          command -v jq         >/dev/null 2>&1 && echo "jq: yes ($(jq --version))" || echo "jq: no"
          bash --version | head -1

      - name: install.sh --help
        shell: bash
        run: bash scripts/install.sh --help >/dev/null

      - name: update.sh --help
        shell: bash
        run: bash scripts/update.sh --help >/dev/null

      - name: Scenario - fresh-install
        shell: bash
        run: bash .github/test-fixtures/scenarios.sh fresh-install

      - name: Scenario - raw-baseline-install
        shell: bash
        run: bash .github/test-fixtures/scenarios.sh raw-baseline-install

      - name: Scenario - install-uuid-fresh
        shell: bash
        run: bash .github/test-fixtures/scenarios.sh install-uuid-fresh

      - name: Scenario - install-uuid-backfill
        shell: bash
        run: bash .github/test-fixtures/scenarios.sh install-uuid-backfill

      - name: Scenario - share-enable-fresh-remote
