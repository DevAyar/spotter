name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # weekly full-matrix drift net (Mondays 06:00 UTC)

# A superseded push cancels its own stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Phase 82 CI-diet: ubuntu runs the full suite on EVERY push (the fast
  # always-on referee); windows + macos run only when the push touches
  # portability-sensitive surfaces — the scripts/hooks/libs the scenarios
  # actually execute — plus on tags, manual dispatch, PRs, and the weekly
  # schedule. Zero scenario deletions, zero assertion weakening; the full
  # matrix stays one workflow_dispatch away.
  detect:
    name: Detect portability surfaces
    runs-on: ubuntu-latest
    outputs:
      os_list: ${{ steps.diff.outputs.os_list }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Phase 107: full history so the ENTIRE push range is diffable.
          # fetch-depth 2 only reached HEAD^, so a multi-commit push whose
          # TIP was docs-only ran linux-only even when earlier commits
          # touched scripts/hooks/libs — which is exactly how Phase 106's
          # safety code got single-platform coverage. Cost: a few seconds
          # on one ubuntu job, against shipping portability-sensitive code
          # unverified on two platforms.
          fetch-depth: 0
      - id: diff
        shell: bash
        run: |
          full='["ubuntu-latest", "windows-latest", "macos-latest"]'
          linux='["ubuntu-latest"]'
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            echo "os_list=$full" >> "$GITHUB_OUTPUT"
            echo "full matrix: event=${{ github.event_name }} ref_type=${{ github.ref_type }}"
            exit 0
          fi
          # Diff the whole push range, not just its tip. Fail OPEN (full
          # matrix) on branch creation (all-zero before), a missing before,
          # or a before this clone cannot resolve (force push).
          before='${{ github.event.before }}'
          case "$before" in
            ''|0000000000000000000000000000000000000000)
              echo "os_list=$full" >> "$GITHUB_OUTPUT"
              echo "full matrix: no before-sha (branch creation) — fail-open"
              exit 0 ;;
          esac
          if ! git rev-parse --verify "$before^{commit}" >/dev/null 2>&1; then
            echo "os_list=$full" >> "$GITHUB_OUTPUT"
            echo "full matrix: before-sha unreachable (force push?) — fail-open"
            exit 0
          fi
          changed=$(git diff --name-only "$before" HEAD)
          echo "$changed"
          if printf '%s\n' "$changed" | grep -qE '^(scripts/|\.claude/(scripts|hooks|lib)/|template/\.claude/(scripts|hooks|lib)/|\.github/(test-fixtures/|workflows/ci\.yml))'; then
            echo "os_list=$full" >> "$GITHUB_OUTPUT"
            echo "full matrix: portability surface touched"
          else
            echo "os_list=$linux" >> "$GITHUB_OUTPUT"
            echo "linux-only: no portability surface in this push"
          fi

  test:
    name: Test (${{ matrix.os }})
    needs: detect
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.detect.outputs.os_list) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show environment
        shell: bash
        run: |
          uname -a
          python --version
          command -v sha256sum >/dev/null 2>&1 && echo "sha256sum: yes" || echo "sha256sum: no"
          command -v shasum     >/dev/null 2>&1 && echo "shasum: yes"     || echo "shasum: no"
          command -v jq         >/dev/null 2>&1 && echo "jq: yes ($(jq --version))" || echo "jq: no"
          bash --version | head -1

      - name: install.sh --help
        shell: bash
        run: bash scripts/install.sh --help >/dev/null

      - name: update.sh --help
        shell: bash
        run: bash scripts/update.sh --help >/dev/null

      - name: Scenario - fresh-install
        shell: bash
        run: bash .github/test-fixtures/scenarios.sh fresh-install

      - name: Scenario - raw-baseline-install
        shell: bash
        run: bash .github/test-fixtures/scenarios.sh raw-baseline-install

      - name: Scenario - install-uuid-fresh
        shell: bash
        run: bash .github/test-fixtures/scenarios.sh install-uuid-fresh

      - name: Scenario - install-uuid-backfill
